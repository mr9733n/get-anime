[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "get-anime"
version = "0.3.8"
requires-python = ">=3.12"

dependencies = [
    # Core
    "attrs~=25.4.0",
    "typing-extensions~=4.15.0",
    "sqlalchemy~=2.0.44",
    "greenlet~=3.2.4",
    "jinja2~=3.1.6",
    "pillow>=12.2.0",
    "pydantic~=2.12.5",

    # HTTP / networking
    "requests>=2.33.0",
    "aiohttp>=3.13.4",
    "httpx~=0.28.1",
    "beautifulsoup4~=4.14.3",

    # Backend HTTP server
    "fastapi~=0.128.0",
    "uvicorn~=0.40.0",
    "starlette~=0.50.0",
    "anyio~=4.12.1",

    # Desktop player integrations
    "python-vlc~=3.0.21203",
    "python-mpv~=1.0.8",

    # Desktop UI (legacy Qt app)
    "PyQt6",
    "PyQt6-WebEngine",

    # Build
    "pyinstaller~=6.17.0",

    # Optional utilities
    "python-dotenv>=1.2.2",
    "qrcode~=8.2",
]

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-asyncio~=1.3.0",
    "pytest-mock~=3.15.1",
    "pytest-qt~=4.5.0",
]

[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

